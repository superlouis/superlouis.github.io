items:
  - title: GATGNN
    subtitle: Global Attention based Graph Convolutional Neural Networks for Improved Materials Property Prediction
    description: |-
      We proposed GATGNN, a novel graph convolutional neural network model with global attention mechanisms for accurate materials property prediction.
      Evaluations on standard materials projects dataset over multiple materials properties such as band gap, bulk-moduli, shear moduli, etc show that our proposed graph convolutional network models achieve better predictive performance than renowned CGCNN and MEGNET. 
      The success of our GATGNN can be attributed to its local attention mechanism and global attention layer. Particularly, our global attention technique implements the assumption that some atoms may be more influential to the measured value of the crystal property.
      Despite the important predicting improvement of our GATGNN over the referred baselines, conducting additional investigations with other localor global atomic context information would be very important in validating the functioning and importance of our global attention layer and further improve the performance in materials property prediction.
    tags: Graph Neural Networks, Deep Learning, Materials Science, Properties Prediction
